<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولد مفاتيح زيدان كيدز 2026</title><style>body{font-family:Tahoma,Arial;background:#0f172a;color:#fff;padding:20px;max-width:460px;margin:auto}input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;font-size:16px;box-sizing:border-box}input{background:#1e293b;color:#fbbf24;text-align:center;direction:ltr}select{background:#1e293b;color:#fff}button{background:#10b981;color:#fff;font-weight:bold;border:none;cursor:pointer}.box{background:#1e293b;padding:16px;border-radius:12px;border:2px solid #38bdf8;text-align:center;margin-top:12px;font-size:22px;font-weight:bold;color:#38bdf8;direction:ltr}</style></head><body><h2 style="color:#38bdf8;text-align:center">🔑 مولد مفاتيح زيدان كيدز 2026</h2><label>كود جهاز العميل (ZK-...):</label><input id="d" placeholder="ZK-XXXX-XXXX" oninput="calc()"><label>اختر الصف المطلوب تفعيله:</label><select id="g" onchange="calc()"><option value="G1">الصف الأول الابتدائي (G1)</option><option value="G2">الصف الثاني الابتدائي (G2)</option><option value="G3">الصف الثالث الابتدائي (G3)</option><option value="G4">الصف الرابع الابتدائي (G4)</option><option value="G5">الصف الخامس الابتدائي (G5)</option><option value="G6">الصف السادس الابتدائي (G6)</option><option value="ALL">تفعيل شامل لكل الصفوف (ALL)</option></select><div class="box" id="out">---</div><button onclick="navigator.clipboard.writeText(document.getElementById('out').innerText)">📋 نسخ المفتاح لإرساله للعميل</button><script>function key(d,g){const s=d.trim().toUpperCase()+":"+g+":SONAATECH_2026";let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return g+"-"+Math.abs(h).toString(16).toUpperCase().padStart(6,"0").slice(0,6);}function calc(){const d=document.getElementById('d').value;const g=document.getElementById('g').value;document.getElementById('out').innerText=d.trim()?key(d,g):'---';}</script></body></html>
